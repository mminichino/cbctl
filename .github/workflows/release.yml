name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Informational only: reports the health of the recent scheduled nightlies next to the
  # release. The nightly is a health signal, not a gate: goreleaser does not need this job,
  # --report-only always exits 0 on a red streak, and continue-on-error covers an API error.
  nightly-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Nightly health report (never blocks)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          go run ./cmd/cbdev ci release-gate
          --commit "${GITHUB_SHA}"
          --repo "${GITHUB_REPOSITORY}"
          --report-only

  goreleaser:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # A cancelled run stops before the "latest" step, so latest is never moved to a partial release.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Floating "latest" tag + release so /releases/download/latest/<asset> works.
      # (GitHub's /releases/latest/download/... alias is separate and still points at the semver release.)
      - name: Update latest tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA}"
          ASSETS="$(mktemp -d)"

          gh release download "${TAG}" -D "${ASSETS}"

          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes
          fi

          git tag -f latest "${SHA}"
          git push origin refs/tags/latest --force

          gh release create latest "${ASSETS}"/* \
            --title "latest (${TAG})" \
            --notes "Floating release pointing at ${TAG}. Prefer versioned tags for reproducibility." \
            --latest=false
