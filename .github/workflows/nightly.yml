name: nightly
# A probe dispatch is named "probe: KIND" so dedupe (cbdev ci dedupe) can tell it from the suite.
run-name: "${{ inputs.probe && format('probe: {0}', inputs.probe) || 'nightly' }}"
# CAP-032: Capella sandbox integration every night. The weekly janitor is janitor.yml.
# Needs repository secret CAPELLA_SANDBOX_API_KEY and repository variable CAPELLA_SANDBOX_ORG_ID.
# A health signal for main (schedule) or any ref (workflow_dispatch), never a gate: no merge,
# push, tag or release waits for it. `cbdev ci release-gate --report-only` summarizes the streak.

on:
  schedule:
    - cron: "0 7 * * *"     # every night at 07:00 UTC
  workflow_dispatch:
    inputs:
      probe:
        description: "Run only a live API probe instead of the suite (the health report ignores dispatches)"
        type: choice
        options: ["", "schedule"]
        default: ""

permissions:
  contents: read

# One sandbox run at a time; a second run waits rather than cancelling one mid-teardown.
concurrency:
  group: nightly-sandbox
  cancel-in-progress: false

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # Fails open: an API error prints a warning and runs the suite.
      - name: Skip a duplicate of another run on this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/cbdev ci dedupe --workflow nightly.yml

  integration:
    needs: dedupe
    if: needs.dedupe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # D1: the CLI and the suite read the standard names; the secret keeps its sandbox name.
      CAPELLA_API_KEY: ${{ secrets.CAPELLA_SANDBOX_API_KEY }}
      # D4: the organization ID is a repository variable and also the allowlist.
      CAPELLA_ORG_ID: ${{ vars.CAPELLA_SANDBOX_ORG_ID }}
      CBCTL_IT_ALLOWED_ORG_IDS: ${{ vars.CAPELLA_SANDBOX_ORG_ID }}
      CBCTL_IT_REQUIRE_TARGET: "1"
      CBCTL_IT_TARGET: sandbox
      CBCTL_IT_CLUSTERS: "1"
      # CBCTL_IT_LOG, CBCTL_IT_REPORT and CBCTL_IT_SECRETS_DIR are set in a step as absolute
      # paths: github.workspace and runner.* are not valid in job-level env.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Preflight (credentials present)
        run: |
          if [ -z "$CAPELLA_API_KEY" ]; then
            echo "::error::secret CAPELLA_SANDBOX_API_KEY is empty"; exit 1
          fi
          if [ -z "$CAPELLA_ORG_ID" ]; then
            echo "::error::variable CAPELLA_SANDBOX_ORG_ID is empty"; exit 1
          fi

      - name: Artifact paths and the runner's address
        run: |
          mkdir -p "$RUNNER_TEMP/cbctl-it-secrets"
          {
            echo "CBCTL_IT_LOG=$GITHUB_WORKSPACE/integration.log"
            echo "CBCTL_IT_REPORT=$GITHUB_WORKSPACE/integration-report.json"
            echo "CBCTL_IT_SECRETS_DIR=$RUNNER_TEMP/cbctl-it-secrets"
            echo "CAPELLA_SANDBOX_CLIENT_CIDR=$(curl -fsS https://api.ipify.org)/32"
          } >> "$GITHUB_ENV"

      - name: Integration suite (teardown runs whatever happens)
        env:
          CBCTL_IT_PROBE: ${{ inputs.probe }}
        run: |
          case "$CBCTL_IT_PROBE" in
            "") go test -tags=integration -timeout 290m -v ./internal/integration/... ;;
            schedule) go test -tags=integration -timeout 120m -v -run 'TestScheduleProbe$' ./internal/integration/... ;;
            *) echo "::error::unknown probe $CBCTL_IT_PROBE"; exit 1 ;;
          esac

      # The suite sweeps its run prefix on a timeout or signal; this covers a job that was
      # killed before it could. The prefix is this run's only: never other runs' projects.
      - name: Sweep this run's projects
        if: always()
        timeout-minutes: 30
        run: >-
          go run ./cmd/cbctl capella janitor
          --prefix "cbctl-ci-${{ github.run_id }}-${{ github.run_attempt }}-"
          --older-than-hours 0 --max-total-minutes 25 --yes

      - name: No secret in the logs
        if: always()
        run: |
          go run ./cmd/cbdev ci scan-secrets "$CBCTL_IT_LOG" "$CBCTL_IT_REPORT" \
            --env CAPELLA_API_KEY \
            --secrets-dir "$CBCTL_IT_SECRETS_DIR" \
            --require-secrets 1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-log
          path: |
            integration.log
            integration-report.json
          if-no-files-found: error
