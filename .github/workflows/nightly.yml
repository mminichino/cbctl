name: nightly
# CAP-032: Capella sandbox integration every night, and a weekly janitor for leftovers.
# Needs repository secrets CAPELLA_SANDBOX_API_KEY and CAPELLA_SANDBOX_ORG_ID.
# A release tag needs three consecutive green scheduled runs, the newest on the tagged commit
# (cbdev ci release-gate).

on:
  schedule:
    - cron: "0 7 * * *"     # integration suite, every night at 07:00 UTC
    - cron: "0 9 * * 0"     # janitor, Sundays at 09:00 UTC
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [integration, janitor]
        default: integration

permissions:
  contents: read

concurrency:
  group: nightly-sandbox
  cancel-in-progress: false

jobs:
  integration:
    if: github.event.schedule == '0 7 * * *' || inputs.job == 'integration'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CAPELLA_SANDBOX_API_KEY: ${{ secrets.CAPELLA_SANDBOX_API_KEY }}
      CAPELLA_SANDBOX_ORG_ID: ${{ secrets.CAPELLA_SANDBOX_ORG_ID }}
      CBCTL_IT_TARGET: sandbox
      CBCTL_IT_CLUSTERS: "1"
      CBCTL_IT_LOG: integration.log
      CBCTL_IT_REPORT: integration-report.json
      # CBCTL_IT_SECRETS_DIR is set in a step: runner.* is not valid in job-level env.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Allow this runner on the shared cluster
        run: |
          echo "CAPELLA_SANDBOX_CLIENT_CIDR=$(curl -fsS https://api.ipify.org)/32" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/cbctl-it-secrets"
          echo "CBCTL_IT_SECRETS_DIR=$RUNNER_TEMP/cbctl-it-secrets" >> "$GITHUB_ENV"

      - name: Integration suite (teardown runs whatever happens)
        run: |
          if [ ! -f internal/integration/harness.go ]; then
            echo "skip: internal/integration/harness.go not present yet"
            exit 0
          fi
          go test -tags=integration -timeout 290m -v ./internal/integration/...

      - name: No secret in the logs
        if: always()
        run: |
          go run ./cmd/cbdev ci scan-secrets integration.log integration-report.json \
            --env CAPELLA_SANDBOX_API_KEY \
            --secrets-dir "${CBCTL_IT_SECRETS_DIR}" || true
          # report-only until the suite always writes the log paths; still exercise the scanner

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-log
          path: |
            integration.log
            integration-report.json
          if-no-files-found: warn

  janitor:
    if: github.event.schedule == '0 9 * * 0' || inputs.job == 'janitor'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CAPELLA_SANDBOX_API_KEY: ${{ secrets.CAPELLA_SANDBOX_API_KEY }}
      CAPELLA_SANDBOX_ORG_ID: ${{ secrets.CAPELLA_SANDBOX_ORG_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Delete cbctl-ci-* projects older than 24 hours
        run: go run ./cmd/cbctl capella janitor --older-than-hours 24 --fail-on-leftovers --yes
