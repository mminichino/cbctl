apiVersion: cbctl/v1
projects:
  - name: one
  - name: two
    clusters:
      - name: c
        cloudProvider: { type: aws, region: us-east-1 }
        availability: { type: multi }
        support: { plan: basic, timezone: PT }
        serviceGroups:
          - node:
              compute: { cpu: 4, ram: 16 }
              disk: { type: gp3, storage: 50, iops: 3000 }
            numOfNodes: 1
            services: [data]
