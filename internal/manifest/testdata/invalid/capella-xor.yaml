apiVersion: cbctl/v1
kind: CouchbaseCapella
metadata:
  name: both
spec:
  project: p
  size: small
  serviceGroups:
    - services: [data]
      nodes: 3
      compute: { cpu: 4, ramGb: 16 }
---
apiVersion: cbctl/v1
kind: CouchbaseCapella
metadata:
  name: neither
spec:
  project: p
---
apiVersion: cbctl/v1
kind: CouchbaseCapella
metadata:
  name: dev-multi
spec:
  project: p
  size: dev
  availability: multi
  buckets:
    - name: b
      replicas: 1
---
apiVersion: cbctl/v1
kind: CouchbaseCapella
metadata:
  name: bad-size
spec:
  project: p
  size: smal
