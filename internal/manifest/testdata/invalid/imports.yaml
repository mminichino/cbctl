apiVersion: cbctl/v1
kind: CouchbaseServer
metadata:
  name: airline-ops
spec:
  credentials:
    password: ${CB_PASSWORD}
  nodes:
    - ipAddress: 10.0.0.1
  buckets:
    - name: flights
      import:
        - file: a.jsonl
          data:
            - {id: 1}
        - {}
        - scope: ops
          collection: gates
          data: []
        - scope: ops
          collection: gates
          credential: app
          data:
            - {id: 1}
            - just a string
        - collection: other
          file: data/missing.jsonl
        - collection: keyed
          keyField: id
          data:
            - {id: a}
            - {id: a}
            - {name: no id}
            - {id: 1.5}
            - {id: true}
            - {id: ""}
