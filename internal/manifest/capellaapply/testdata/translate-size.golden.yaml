apiVersion: cbctl/v1
projects:
  - clusters:
      - availability:
          type: single
        buckets:
          - memoryAllocationInMb: 1024
            name: flights
            replicas: 0
            type: couchbase
        cloudProvider:
          cidr: 10.0.10.0/24
          region: us-east1
          type: gcp
        configurationType: singleNode
        name: dev-cluster
        serviceGroups:
          - node:
              compute:
                cpu: 4
                ram: 16
              disk:
                storage: 50
                type: pd-ssd
            numOfNodes: 1
            services:
              - data
              - index
              - query
        support:
          plan: basic
    name: airline-demo
